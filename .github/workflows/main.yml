name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PNS-Quet-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PNS-Quet.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PNS-Quet-apk
          path: PNS-Quet-android/PNS-Quet.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PNS Quet 1.0.${{ github.run_number }}
          files: PNS-Quet-android/PNS-Quet.apk
          make_latest: true
